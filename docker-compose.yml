services:
  postgres:
    image: postgres:17-alpine
    container_name: abf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: abf-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "pass" ]
    ports:
      - "6399:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "pass", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
