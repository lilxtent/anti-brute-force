services:
  postgres:
    image: postgres:17-alpine
    container_name: abf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: abf-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "pass" ]
    ports:
      - "6399:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "pass", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: golang:1.26-alpine
    container_name: abf-migrate
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    command:
      - sh
      - -c
      - go run github.com/pressly/goose/v3/cmd/goose@latest -dir migrations postgres "postgres://user:pass@postgres:5432/db?sslmode=disable" up
    depends_on:
      postgres:
        condition: service_healthy

  abf:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        SERVICE: server
    image: abf-server:develop
    container_name: abf-server
    restart: unless-stopped
    environment:
      CONFIG_FILE: /etc/abf/docker_config.yaml
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  go-mod-cache:
